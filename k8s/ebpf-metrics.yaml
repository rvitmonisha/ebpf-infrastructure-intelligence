apiVersion: v1
kind: Namespace
metadata:
  name: ebpf-intelligence
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ebpf-metrics
  namespace: ebpf-intelligence
  labels:
    app: ebpf-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ebpf-metrics
  template:
    metadata:
      labels:
        app: ebpf-metrics
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: exporter
          image: ebpf-intelligence:local
          imagePullPolicy: IfNotPresent
          env:
            - name: EBPF_COLLECTOR_ENABLED
              value: "false"
          ports:
            - name: metrics
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ebpf-metrics
  namespace: ebpf-intelligence
  labels:
    app: ebpf-metrics
spec:
  selector:
    app: ebpf-metrics
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics
  type: ClusterIP
